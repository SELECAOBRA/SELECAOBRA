<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090f1d">
  <meta name="description" content="Calculadora de pontuação do Grand Prix.">
  <link rel="stylesheet" href="grandprix.css?v=2">
  <title>Calculadora do Grand Prix</title>
</head>
<body>
<header class="hero"><div class="hero__inner">
  <a class="brand" href="index.html" aria-label="Voltar para a calculadora de batalha"><img class="brand__logo" src="images/logo.png" alt="Seleção BR"><div><p>GRAND PRIX</p><h1>Calculadora do Grand Prix</h1></div></a>
  <nav aria-label="Navegação principal"><a class="button" href="index.html">Batalha</a><button class="button" id="clearButton" type="button">Limpar</button></nav>
</div></header>
<main class="container">
  <p id="status" class="notice" role="status" aria-live="polite">Carregando equipes…</p>
  <section id="calculator" class="panel hidden" aria-labelledby="calculatorTitle">
    <h2 id="calculatorTitle">Projeção da equipe</h2>
    <div class="team-grid">
      <label class="team-field"><span>Equipe</span><select id="teamSelect"><option value="">Selecione a equipe</option></select></label>
      <div class="team-score"><span>Pontuação atual</span><strong id="teamScore">0</strong></div>
    </div>
    <p id="teamsUpdated" class="updated"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Jogador</th><th>Posição</th><th>Pontuação</th></tr></thead>
      <tbody id="players">
        <tr><th scope="row">1</th><td><input class="position" type="text" inputmode="numeric" autocomplete="off" placeholder="1–40" aria-label="Posição do jogador 1"></td><td class="points">0</td></tr>
        <tr><th scope="row">2</th><td><input class="position" type="text" inputmode="numeric" autocomplete="off" placeholder="1–40" aria-label="Posição do jogador 2"></td><td class="points">0</td></tr>
        <tr><th scope="row">3</th><td><input class="position" type="text" inputmode="numeric" autocomplete="off" placeholder="1–40" aria-label="Posição do jogador 3"></td><td class="points">0</td></tr>
        <tr><th scope="row">4</th><td><input class="position" type="text" inputmode="numeric" autocomplete="off" placeholder="1–40" aria-label="Posição do jogador 4"></td><td class="points">0</td></tr>
      </tbody>
      <tfoot><tr><th colspan="2">PROJEÇÃO FINAL</th><th id="grandTotal">0</th></tr></tfoot>
    </table></div>
    <p class="rule">Pontuação por jogador = 51 − posição. Campos vazios ou inválidos valem 0.</p>
    <figure class="grandprix-image"><img id="grandprixImage" src="images/grandprix.png" alt="Informações do Grand Prix"><figcaption>Referência do Grand Prix</figcaption></figure>
  </section>
</main>
<script src="grandprix.js?v=3" defer></script>
</body></html>
