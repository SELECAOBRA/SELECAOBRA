<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f1d"><meta name="description" content="Calculadora de pontuação para eventos de corrida."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=10"><title>Calculadora de Pontos</title></head><body>
<header class="hero"><div class="hero__inner"><div class="brand"><img class="brand__logo" src="images/logo.png" alt="Seleção BR"><div><p class="eyebrow">BATALHA DE PISTAS</p><h1>Calculadora de Pontos</h1></div></div><nav aria-label="Navegação principal" style="display:flex;gap:7px;align-items:center"><a class="button button--ghost" href="grandprix.html">Grand Prix</a><button class="button button--ghost" id="clearButton" type="button">Limpar</button></nav></div></header>
<main class="container"><noscript><p class="notice notice--error">Este site precisa de JavaScript.</p></noscript><p id="status" class="notice" role="status" aria-live="polite">Carregando configuração…</p>
<section id="calculator" class="hidden" aria-label="Calculadora"><div id="captureArea" class="capture-area"><div class="capture-brand"><img src="images/logo.png" alt=""><strong>Calculadora de Pontos</strong></div><div class="panel compact-setup"><label class="field event-picker"><span>Evento</span><select id="eventSelect"></select></label><div class="event-title"><span id="eventLabel" class="pill"></span><strong id="eventName"></strong><small id="updatedAt"></small></div></div><div class="table-wrap"><table class="score-table"><thead><tr><th>Pista</th><th>Veículo</th><th>Tipo</th><th>Tempo / Distância</th><th>Pontuação</th></tr></thead><tbody id="tracks"></tbody><tfoot><tr><th colspan="4">TOTAL</th><th><span id="totalScore">0</span> pts</th></tr></tfoot></table></div><p id="completedText" class="completed-text">0 pistas preenchidas</p></div>
<p class="footnote" id="limitsText"></p><figure class="weekly"><img id="weeklyImage" src="images/evento-semanal.png" alt="Tabela semanal do evento"><figcaption>Referência semanal do evento</figcaption></figure></section></main>
<template id="trackTemplate"><tr class="track-row"><th scope="row" class="track-name"></th><td><input class="vehicle-input" type="text" maxlength="30" autocomplete="off" placeholder="Veículo"></td><td><span class="track-type"></span></td><td><div class="compact-input"><input class="track-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span class="unit"></span></div><small class="error" aria-live="polite"></small></td><td class="track-score">—</td></tr></template>
<script src="app.js?v=10" defer></script></body></html>
